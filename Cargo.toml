[package]
name = "yubi"
version = "0.1.0"
edition = "2024"
description = "Gesture engine and settings app for Apple Magic Trackpad on Windows"
publish = false

[dependencies]
eframe = "0.37"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
